<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Backpack · J McCann & Co Ltd</title>
    <script>
      // spa-github-pages redirect technique: https://github.com/rafgraph/spa-github-pages
      // Preserve the path and query string by encoding them into a redirect query param.
      var segmentCount = 1; // number of path segments in the repo name (1 for /backpack/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
